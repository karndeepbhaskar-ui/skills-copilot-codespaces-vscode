<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
      }

      .calculator {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Simple Calculator</h1>
    <div class="calculator">
      <input id="firstNumber" type="number" step="any" aria-label="First number" />
      <select id="operator" aria-label="Operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <input id="secondNumber" type="number" step="any" aria-label="Second number" />
      <button id="calculateBtn" type="button">Calculate</button>
    </div>
    <p id="result" aria-live="polite"></p>

    <script src="./calculator.js"></script>
    <script>
      const firstInput = document.getElementById("firstNumber");
      const secondInput = document.getElementById("secondNumber");
      const operatorInput = document.getElementById("operator");
      const result = document.getElementById("result");
      const calculateBtn = document.getElementById("calculateBtn");

      calculateBtn.addEventListener("click", () => {
        try {
          const value = calculate(
            Number(firstInput.value),
            Number(secondInput.value),
            operatorInput.value,
          );
          result.textContent = `Result: ${value}`;
        } catch (error) {
          result.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
